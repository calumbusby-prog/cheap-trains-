[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheaptrains"
version = "0.1.0"
description = "Weekend cheap-train-ticket alert service for Spain"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
renfe = ["playwright>=1.40"]
dev = ["pytest>=7.4"]

[project.scripts]
cheaptrains = "cheaptrains.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
